<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Finding a human · Find the Human</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
  /* Finding a human: FIFO queue, then the table fills (SPEC §1, §2.1). Auto-advances to the table. */
  .wrap{max-width:760px;margin:0 auto;padding:0 16px 48px;text-align:center}
  .logo{color:var(--gold);font-size:14px;padding-top:12px;text-align:left}
  .disclosure{background:var(--ink);color:var(--gold);border:3px solid var(--gold);padding:8px 12px;font-size:19px;line-height:1.2;border-radius:6px;margin-top:12px}
  .stage{margin-top:28px;background:var(--wood);border:4px solid var(--ink);box-shadow:6px 6px 0 var(--ink);border-radius:12px;padding:26px 16px}
  .title{font-family:'Press Start 2P',monospace;font-size:16px;color:var(--gold);margin:0 0 18px;line-height:1.5}
  .seats{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
  .slot{width:64px;height:64px;border-radius:50%;background:var(--wood-d);border:4px dashed var(--parch-d);display:flex;align-items:center;justify-content:center;font-family:'Press Start 2P',monospace;font-size:10px;color:var(--parch-d)}
  .slot.filled{background:var(--parch);border:4px solid var(--ink);color:var(--ink)}
  .slot canvas{width:50px;height:50px;image-rendering:pixelated}
  .slot.blink{animation:blink 1s steps(2,start) infinite}
  @keyframes blink{to{visibility:hidden}}
  .status{font-size:24px;color:var(--parch);min-height:30px;margin:0}
  .dots{font-family:'Press Start 2P',monospace;font-size:12px;color:var(--gold);letter-spacing:4px;height:20px}
  .dots i{display:inline-block;animation:blink 1.2s steps(2,start) infinite}
  .dots i:nth-child(2){animation-delay:.3s}
  .dots i:nth-child(3){animation-delay:.6s}
  .counts{margin-top:14px;font-size:21px;color:var(--parch-d)}
  .actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:22px}
  .btn{font-family:'Press Start 2P',monospace;font-size:11px;line-height:1.3;padding:14px 18px;border:4px solid var(--ink);box-shadow:0 5px 0 var(--ink);border-radius:10px;text-decoration:none;color:var(--ink);background:var(--gold);cursor:pointer}
  .btn.ghost{background:var(--parch)}
</style>
</head>
<body>
<div class="wrap">
  <div class="px logo">Find the Human</div>
  <nav class="flow" aria-label="Prototype screens"><a href="start.html">Start</a><a class="on" href="matching.html">Matching</a><a href="game-screen.html">Table</a><a href="result.html">Result</a><a href="stats.html">Stats</a></nav>
  <div class="disclosure">Some players at every table are AI. AI players will claim to be human — that's the game.</div>

  <section class="stage">
    <h1 class="title">Finding a human</h1>
    <div class="seats" id="seats"></div>
    <p class="status" id="status">Joining the queue</p>
    <div class="dots" aria-hidden="true"><i>.</i><i>.</i><i>.</i></div>
    <p class="counts" id="counts">Humans waiting: 1 of 2</p>
    <div class="actions">
      <a class="btn ghost" href="start.html">Cancel</a>
      <a class="btn" id="sit" href="game-screen.html">Sit down now</a>
    </div>
  </section>
</div>

<script src="shared.js"></script>
<script>
// Mock queue. Five seats: you (Amber Owl) plus four others; the second human fills seat 1 when found.
const steps = [
  {at: 0,    status: 'Joining the queue',              counts: 'Humans waiting: 1 of 2', filled: 1},
  {at: 1400, status: 'Waiting for a second human',    counts: 'Humans waiting: 1 of 2', filled: 1},
  {at: 2800, status: 'Human found! Filling the seats', counts: 'Humans waiting: 2 of 2', filled: 2},
  {at: 4000, status: 'Table ready. Taking your seat',  counts: 'Table ready', filled: 5}
];
const seatOrder = [0, 1, 2, 3, 4];
function paint(n){
  const row = document.getElementById('seats');
  row.innerHTML = seatOrder.map(i => {
    if (i < n) return `<div class="slot filled"><canvas width="16" height="16" data-seed="${SEATS[i].seed}"></canvas></div>`;
    return `<div class="slot blink"></div>`;
  }).join('');
  initSprites(row);
}
steps.forEach(s => setTimeout(() => {
  document.getElementById('status').textContent = s.status;
  document.getElementById('counts').textContent = s.counts;
  paint(s.filled);
}, s.at));
setTimeout(() => { location.href = 'game-screen.html'; }, 5600);
paint(1);
</script>
</body>
</html>
